upstream varnish_backend {
    server 127.0.0.1:6081;
    keepalive 200;
}

# Redirección obligatoria de HTTP a HTTPS
server {
    listen 80;
    server_name eljoviz.servepics.com;
    return 301 https://$host$request_uri;
}

# Servidor Seguro HTTPS con HTTP/2 y Cabeceras de Seguridad Avanzadas
server {
    listen 443 ssl;
    http2 on;
    server_name eljoviz.servepics.com;

    ssl_certificate /etc/letsencrypt/live/eljoviz.servepics.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/eljoviz.servepics.com/privkey.pem;

    # Protocolos y cifrados modernos recomendados
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # Cabeceras de Seguridad Profesional (A+ en SSL Labs y OWASP)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    location / {
        proxy_pass http://varnish_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
